name: watch

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知を送る（ntfy と Issue）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 在庫チェック
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test }}
        run: python3 -I check.py

      - name: 状態を保存
        if: always()
        run: |
          git config user.name "refurb-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- state.json || [ -n "$(git ls-files --others --exclude-standard state.json)" ]; then
            git add state.json
            git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
