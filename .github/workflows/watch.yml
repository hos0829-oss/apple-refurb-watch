name: watch

# 1回の実行で最大 52 分間、5 分おきに在庫を確認し、終了時に次の実行を自分で起動する（連鎖）。
# GitHub の時刻起動（cron）は遅延・間引きされることがあるので、連鎖が切れた時の再開用に毎時 1 回だけ置いている。
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "テスト通知を送る（ntfy と Issue）"
        type: boolean
        default: false
      chain:
        description: "終了時に次の実行を起動する（止めるときは no）"
        type: string
        default: "yes"
      minutes:
        description: "この実行で確認を続ける時間（分）"
        type: string
        default: "52"

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 在庫チェック（5分おき）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          git config user.name "refurb-watch[bot]"
          git config user.email "actions@users.noreply.github.com"
          end=$(( SECONDS + ${MINUTES:-52} * 60 ))
          failed=0
          while :; do
            git pull -q --rebase origin main || true
            python3 -I check.py || failed=1
            unset TEST_NOTIFY
            if ! git diff --quiet -- state.json; then
              git add state.json
              git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
              git push -q || { git pull -q --rebase origin main && git push -q; }
            fi
            [ "$SECONDS" -ge "$end" ] && break
            sleep 300
          done
          exit $failed

      - name: 次の実行を起動
        if: ${{ !cancelled() && inputs.chain != 'no' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref main -f chain=yes
